[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fllbot"
version = "0.2.0"
description = "NapCat / OneBot 11 QQ bot backend with plugins, permissions and LLM chat"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "packaging>=24,<27",
    "Pillow>=10.4,<13",
    "markdown-it-py>=3,<5",
    "Pygments>=2.18,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
]

[project.scripts]
fllbot = "fllbot.cli:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["fllbot*"]

[tool.setuptools.package-data]
fllbot = ["builtin_plugins/*/*.md", "builtin_plugins/*/plugin.toml",
    "builtin_plugins/github/assets/octicons/*.png", "builtin_plugins/github/assets/octicons/LICENSE",
    "builtin_plugins/github/assets/octicons/README.md",
    "builtin_plugins/*/docs/*.md", "plugin/templates/*.tmpl", "plugin/templates/docs/*.tmpl",
    "rendering/*.cjs", "rendering/vendor/elk/*.js", "rendering/vendor/elk/*.md",
    "ui/*.html", "ui/*.css", "ui/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
# 工具缓存与测试临时目录统一收在 .local/ 下（已 gitignore），保持项目根目录整洁
cache_dir = ".local/pytest_cache"

[tool.ruff]
line-length = 120
target-version = "py311"
cache-dir = ".local/ruff_cache"
extend-exclude = [".venv", "data", "logs", ".local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["fllbot", "helpers", "tools"]

[tool.ruff.lint.per-file-ignores]
"fllbot/api/routes.py" = ["B008"]  # FastAPI 的 Body(...) 依赖注入写法
"fllbot/api/console.py" = ["B008"]  # FastAPI 的 Query(...) 依赖注入写法
