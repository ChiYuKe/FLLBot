[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fllbot"
version = "0.2.0"
description = "NapCat / OneBot 11 QQ bot backend with plugins, permissions and LLM chat"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
]

[project.scripts]
fllbot = "fllbot.cli:main"

[tool.setuptools.packages.find]
include = ["fllbot*"]

[tool.setuptools.package-data]
fllbot = ["personas/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "data", "logs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["fllbot", "helpers", "tools"]

[tool.ruff.lint.per-file-ignores]
"fllbot/api/routes.py" = ["B008"]  # FastAPI 的 Body(...) 依赖注入写法
