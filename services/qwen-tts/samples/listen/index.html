<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>萝莉声线 · 十条带编号试听</title>
<style>
  :root { --bg:#0e1116; --card:#161b23; --line:#242c37; --text:#e6edf3; --muted:#8b98a9; --accent:#f0a6ca; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  header { padding:22px 26px 10px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 6px; font-size:20px; }
  header p { margin:0; color:var(--muted); font-size:12px; }
  main { max-width:980px; margin:0 auto; padding:16px 26px 50px; }
  .item { display:grid; grid-template-columns:54px 1fr; gap:12px; align-items:center;
          background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:10px; }
  .no { font-size:20px; font-weight:700; color:var(--accent); text-align:center; }
  .name { font-weight:600; }
  .desc { color:var(--muted); font-size:12px; margin:2px 0 6px; }
  audio { width:100%; height:34px; }
</style>
</head>
<body>
<header>
  <h1>萝莉声线 · 10 条带编号试听</h1>
  <p>每条先报编号再说同一句话；点播放即可。合集：萝莉声线-十连听-带编号.wav（84 秒）</p>
</header>
<main id="list"></main>
<script>
const VOICES = [
  ["01","软糯","软糯甜美，音调偏高，语速偏慢，句尾上扬"],
  ["02","元气","清亮活泼，音调高，语速稍快，咬字轻快"],
  ["03","气声","气声重，贴耳低语，音量偏小"],
  ["04","奶音","奶音，咬字软，带鼻音，句尾黏"],
  ["05","傲娇","清脆傲娇，尾音短促，带点不耐烦"],
  ["06","慵懒","慵懒软萌，语速慢，尾音拖长"],
  ["07","温柔","中低音区，温柔平稳，甜而不腻"],
  ["08","小恶魔","语速快，句尾俏皮上挑，带笑意"],
  ["09","安静","气息轻，语速慢，没有攻击性"],
  ["10","微沙","音调偏低，带一点沙哑，松弛"]
];
const list = document.getElementById("list");
for (const [no, name, desc] of VOICES) {
  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML = `
    <div class="no">${parseInt(no,10)}</div>
    <div>
      <div class="name">${name}</div>
      <div class="desc">${desc}</div>
      <audio controls preload="none" src="${no}-${name}.wav"></audio>
    </div>`;
  list.appendChild(el);
}
</script>
</body>
</html>
