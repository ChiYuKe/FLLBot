# FLLBot 配置示例。复制为 config.toml 后按需修改：
#   Copy-Item config.example.toml config.toml
# 所有键都可以用环境变量覆盖，规则：FLLBOT_ + 段落 + __ + 键名（全大写），
# 例如 FLLBOT_SERVER__PORT=6702、FLLBOT_LLM__API_KEY=sk-xxx。

[server]
# 监听地址、端口和 CORS 仅从启动配置读取，修改后重启；后台不接受在线更改。
# 监听地址。NapCat 与本程序在同一台机器时保持 127.0.0.1 即可。
host = "127.0.0.1"
port = 6701
# 反向 WebSocket 路径。NapCat 侧填 ws://127.0.0.1:6701/onebot/v11/ws
# 为兼容性，程序实际接受任意路径的 WS 连接。
ws_path = "/onebot/v11/ws"
# 留空表示不校验。强烈建议非回环地址部署时设置，并与 NapCat 的 Token 保持一致。
access_token = ""
# 超过该秒数没有收到心跳/事件则判定连接失联。
heartbeat_timeout = 120.0
# 单次 OneBot API 调用等待响应的秒数。
call_timeout = 30.0
# 管理面板前端跨域来源；本机自用可保留 ["*"]。
cors_origins = ["*"]

[admin]
# enabled/token_file 仅从启动配置读取。关闭管理入口保留健康检查与 OneBot 连接。
enabled = true
# 留空则启动时自动生成，并写入 data/admin_token.txt。
token = ""
token_file = "data/admin_token.txt"

[bot]
# 超级管理员 QQ 号，拥有最高权限。
superusers = []
# 命令前缀，可配置多个；加入 "" 表示允许无前缀裸命令。
command_prefix = ["/"]
# 被 @ 时允许省略前缀（@机器人 ping 等价于 /ping）。
allow_bare_command = true
# 插件抛出异常时回给用户的话；留空则静默失败（只写日志）。
error_reply = ""

[permission]
# 非空时只处理这些群（白名单），留空表示不限制。
allow_groups = []
# 这些群一律忽略（黑名单）。
deny_groups = []
# 未在数据库中登记过的群默认是否启用。
default_group_enabled = true
# 群主/管理员是否被视为高权限用户。
group_admin_permission = true
# 是否允许私聊触发命令。
allow_private = true

[plugin]
# 用户插件目录，相对路径基于项目根目录。
dirs = ["plugins"]
# 是否加载内置插件（basic 命令与 agent 智能体）。
builtin = true
# 检测插件文件改动并自动重载。
hot_reload = true
watch_interval = 2.0
# 全局并发处理上限，防止刷屏把进程打满。
max_concurrency = 6
max_concurrent_per_group = 6 # 同群不同发起者最多同时处理 6 个任务
# 队列中的待处理事件上限；超出时丢弃新到事件并记录日志。
max_pending_events = 1000
# 每位群聊发起者（私聊按会话）的待处理容量；修改后需要重启。
max_pending_per_conversation = 32
# 以下时限用于后续接收事件；已接收事件保留原时限。
queue_timeout_seconds = 30
event_deadline_seconds = 120
# 单个处理器超时秒数。
handler_timeout = 60.0

[storage]
path = "data/fllbot.db"
backup_dir = "data/backups"

[logging]
level = "INFO"
dir = "logs"
json_lines = true
file = "fllbot.log"
# 保留在内存里的日志条数，供 /api/logs 查询。
ring_size = 500
# 诊断消息默认仅记录元数据；显式启用后最多保留 1000 字正文。
capture_message_content = false
# 诊断正文保留小时数（1–168）；启动及每分钟到期擦除，统计元数据保留。
message_content_hours = 24

[llm]
enabled = false
# OpenAI 兼容接口。DeepSeek: https://api.deepseek.com  /v1 可选
base_url = "https://api.deepseek.com"
api_key = ""
model = "deepseek-chat"
timeout = 60.0
max_tokens = 4000
temperature = 0.8
# 模型能力：未知时沿用旧版行为；可按服务商说明或管理页诊断结果调整。
supports_tools = true
supports_images = true
supports_temperature = true
token_parameter = "max_tokens"   # 也可使用 max_completion_tokens
image_token_budget = 4096
max_concurrency = 6
input_price = 0.0                # 每百万 Token 单价；费用限额要求正数价格
output_price = 0.0
# 每个群独立累计，0 表示不限；按服务器本地日期重置。
group_daily_token_limit = 0
group_daily_cost_limit = 0.0
# 临时服务故障时按顺序切换；名称必须已在 providers 中配置。
fallback_providers = []
# 可选：手动指定上下文窗口（Token），优先于模型目录自动发现；留空时跟随模型目录。
# context_window = 1000000
# 默认跟随模型接口返回的上下文窗口；未返回时使用 8192 Token 保守预算。
context_mode = "model"
# 仅 context_mode = "custom" 时使用下面的手工历史预算。
max_context_messages = 16
max_context_chars = 4000
enable_private = true
enable_group = true
# 群聊触发方式：at（@机器人）| prefix（以 trigger_prefix 开头）| always
trigger = "at"
trigger_prefix = "ai"
# 默认人格，对应 personas/ 目录下的文件名（不含 .md）；留空则使用兜底提示词。
persona = ""
# 超长回复按该长度分条发送。
chunk_size = 500
# 同一用户两次对话的最小间隔（秒）。
cooldown_seconds = 3.0
# 追加到系统提示词末尾的额外内容。
system_extra = ""

# ---- 多 provider（可选） --------------------------------------------------
# 不写 [llm.providers] 时，上面的 base_url / api_key / model 就是唯一的 provider（名为 default）。
# default 指定默认 provider；routes 按任务/场景覆盖。
# default = "deepseek"
#
# [llm.providers.deepseek]
# base_url = "https://api.deepseek.com"
# api_key_env = "DEEPSEEK_API_KEY"   # 与 api_key 二选一，优先读环境变量
# model = "deepseek-chat"
# input_price = 0.27                 # 元/百万 token，用于费用估算
# output_price = 1.10
# context_window = 65536            # 每个服务可覆盖全局窗口和能力设置
# supports_tools = true
# supports_images = false
# max_concurrency = 6
#
# [llm.providers.local]
# base_url = "http://127.0.0.1:11434/v1"
# model = "qwen2.5:7b"
# no_stream = true                   # 本地模型可关流式
#
# [llm.routes]
# group = "deepseek"
# private = "deepseek"
# summary = "local"                  # 群聊话题摘要可使用单独的模型服务（群/账号指定服务仍优先）

[chat]
# 长回复默认整理成图片：auto_image 达到阈值转图片，auto 转聊天记录，image 始终图片，
# forward 始终聊天记录，split 普通分段。可在后台 Agent 聊天设置中切换。
# reply_mode = "auto_image"
# forward_threshold = 1200
# 仅作用于已开启 Agent 的群：近期普通群聊也会按需发送给配置的模型服务。
group_memory = true
memory_session_gap_minutes = 30
memory_recent_messages = 200
memory_context_chars = 400000

[sandbox]
# 智能体执行沙盒：工具必须显式声明能力，执行前按这里的策略自动裁决。
# 未声明能力的旧工具不受影响；新插件建议声明 capabilities。
enabled = true
# 工作区目录（相对项目根目录）。文件工具只能读写这里，绝对路径和 .. 会被拒绝。
workspace = "data/agent_workspace"
# 默认只读、可联网、不可写；按需开放。
allow_read = true
allow_write = false
allow_network = true
allow_network_write = false
# 允许访问本机/局域网/保留地址；默认关闭，避免访问内网服务。
allow_private_network = false
allow_qq_send = true
# 群管理、删除等破坏性能力和本机程序执行默认关闭。
allow_destructive = false
allow_process = false
destructive_requires_superuser = true
# 自动参与（未 @、未用唤醒词）时不执行写入/管理类操作。
write_requires_addressed = true
# 联网主机白名单（留空表示不限）与黑名单，支持 *.example.com。
allowed_hosts = []
denied_hosts = []
# 工作区内仍然禁止访问的敏感路径（fnmatch 模式）。
deny_paths = [".env", ".env.*", "config.toml", "data/admin_token.txt", "data/fllbot.db",
    "data/backups", "data/backups/*", "logs", "logs/*", ".git", ".git/*", "*.pem", "*.key", "*.pfx"]
max_read_bytes = 200000
max_write_bytes = 200000
max_fetch_bytes = 2000000
request_timeout = 10.0
max_redirects = 3
# 单轮工具调用与写入次数上限。
max_calls_per_turn = 16
max_write_calls_per_turn = 4

[retention]
# 自动清理默认关闭；0 表示该类不自动清理。保存策略不会立即删除数据。
enabled = false
interval_seconds = 3600
messages_days = 0
conversations_days = 0            # AI 会话、群记忆原文与相关摘要一起处理
usage_days = 0
changes_days = 0
# 消息诊断保持固定 7 天/10000 条；备份、日志文件、配置与插件 KV 不在本策略范围。
